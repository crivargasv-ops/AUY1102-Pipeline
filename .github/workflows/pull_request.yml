name: Typescript for Pull Requests


on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master


jobs:
  lint:   
    name: Revision de codigo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Lint TypeScript
        run: npm run lint
  
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Unit Test TypeScript
        run: npm run test:unit
